<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 650"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#111"/></marker></defs><rect width="1240" height="650" fill="white"/><g fill="none" stroke="#111" stroke-width="2" font-family="sans-serif"><rect x="80" y="15" width="200" height="55" fill="white"/><text x="90" y="45" font-size="24" stroke="none" fill="#111">Fアプリ</text><path d="M180 70 L180 595"/><rect x="480" y="15" width="200" height="55" fill="white"/><text x="490" y="45" font-size="24" stroke="none" fill="#111">A社Webサーバ</text><path d="M580 70 L580 595"/><rect x="980" y="15" width="200" height="55" fill="white"/><text x="990" y="45" font-size="24" stroke="none" fill="#111">Cサービス</text><path d="M1080 70 L1080 595"/><path d="M180 115 L580 115" marker-end="url(#a)"/><text x="265" y="100" font-size="24" stroke="none" fill="#111">フォトグッズを注文</text><rect x="535" y="140" width="90" height="45" fill="white"/><text x="545" y="170" font-size="24" stroke="none" fill="#111">（あ）</text><path d="M580 200 H630 V240 H580" marker-end="url(#a)"/><text x="650" y="205" font-size="24" stroke="none" fill="#111">注文内容をDBサーバに登録し，</text><text x="650" y="235" font-size="24" stroke="none" fill="#111">注文番号を採番</text><rect x="535" y="260" width="90" height="45" fill="white"/><text x="545" y="290" font-size="24" stroke="none" fill="#111">（い）</text><path d="M580 330 L180 330" marker-end="url(#a)"/><text x="280" y="315" font-size="24" stroke="none" fill="#111">注文番号を通知</text><rect x="135" y="350" width="90" height="45" fill="white"/><text x="145" y="380" font-size="24" stroke="none" fill="#111">（う）</text><path d="M180 410 H220 V440 H180" marker-end="url(#a)"/><text x="240" y="410" font-size="24" stroke="none" fill="#111">写真を“nnnnnnnn.zip”という</text><text x="240" y="438" font-size="24" stroke="none" fill="#111">ファイル名でZIP形式に圧縮</text><rect x="135" y="455" width="90" height="45" fill="white"/><text x="145" y="485" font-size="2