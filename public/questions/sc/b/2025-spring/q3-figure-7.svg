<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 440"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#111"/></marker></defs><rect width="1050" height="440" fill="white"/><g fill="none" stroke="#111" stroke-width="2" font-family="sans-serif"><rect x="175" y="20" width="530" height="50" rx="25"/><text x="410" y="53" font-size="24" stroke="none" fill="#111">開始</text><path d="M440 70 L440 100"/><path d="M440 100 L820 185 L440 270 L60 185 Z"/><text x="195" y="178" font-size="22" stroke="none" fill="#111">呼出し元のWebページのURLの先頭は</text><text x="250" y="208" font-size="24" stroke="none" fill="#111">“https://www.a-sha.co.jp”か。</text><path d="M440 270 L440 310"/><text x="450" y="296" font-size="24" stroke="none" fill="#111">Yes</text><rect x="200" y="310" width="380" height="65" fill="white"/><text x="210" y="340" font-size="24" stroke="none" fill="#111">認証トークンを返す。</text><path d="M820 185 H860 V310"/><text x="830" y="173" font-size="24" stroke="none" fill="#111">No</text><rect x="635" y="310" width="380" height="65" fill="white"/><text x="645" y="340" font-size="24" stroke="none" fill="#111">空文字列，つまり長さ0の</text><text x="645" y="368" font-size="24" stroke="none" fill="#111">文字列を返す。</text><path d="M440 375 V400 M860 375 V395 H440"/><rect x="190" y="400" width="510" height="35" rx="17"/><text x="410" y="427" font-size="24" stroke="none" fill="#111">終了</text></g></svg>