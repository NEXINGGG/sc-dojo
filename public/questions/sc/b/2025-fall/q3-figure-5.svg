<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 440"><rect width="1020" height="440" fill="white"/><g stroke="#111" stroke-width="2" fill="none" font-family="sans-serif" font-size="22"><rect x="15" y="15" width="990" height="405"/><text x="200" y="70" fill="#111" stroke="none">高額の振込みのため，本人確認が必要です。</text><text x="75" y="130" fill="#111" stroke="none">本人確認のため，次の数字を数字入力トークンに入力してください。</text><text x="400" y="190" fill="#111" stroke="none">１２３４５６７¹</text><text x="75" y="250" fill="#111" stroke="none">トークンに表示される認証番号を入力し，送信ボタンを押してください。</text><rect x="375" y="275" width="270" height="40"/><rect x="280" y="340" width="175" height="55" fill="white"/><text x="290" y="372" fill="#111" stroke="none">送信</text><rect x="550" y="340" width="185" height="55" fill="white"/><text x="560" y="372" fill="#111" stroke="none">キャンセル</text></g></svg>